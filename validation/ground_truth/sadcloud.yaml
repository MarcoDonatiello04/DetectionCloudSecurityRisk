# =============================================================================
# Riferimento di verità — sadcloud (nccgroup/sadcloud)
# -----------------------------------------------------------------------------
# Scritto PRIMA di qualsiasi esecuzione dello strumento sul bersaglio.
#
# Fonti:
#   [README]  README.md: "approx. 84 misconfigurations across 22 AWS Services";
#             tutte disattivate di default, si attivano con all_findings = true.
#   [MAIN]    sadcloud/main.tf: elenco dei flag che all_findings attiva, modulo
#             per modulo (generato automaticamente, una voce per flag; escluso
#             needs_network, che crea la rete e non è una misconfiguration).
#   [VARS]    modules/aws/<servizio>/variables.tf: campo description di ogni
#             flag, riportato verbatim come descrizione_autore.
#
# Revisione del bersaglio: f538652921a7f3e8e25c0afaecad2d4382f8b21e (2021-07-09)
#
# Configurazione del bersaglio: nella copia in data/test_targets/external/sadcloud
# il file sadcloud/terraform.tfvars è impostato con all_findings = true, come
# indicato dal README per attivare tutte le misconfiguration. È l'unica modifica.
#
# Regola di corrispondenza: una segnalazione corrisponde a una voce se riguarda
# una risorsa dichiarata nel modulo del servizio indicato e descrive la stessa
# misconfiguration. La corrispondenza fra controllo Checkov e voce è stabilita a
# mano dopo l'esecuzione e riportata per esteso, con motivazione, accanto ai
# risultati.
#
# Bias da dichiarare: le voci derivano dalle regole di ScoutSuite (NCC Group),
# che lavora sull'account AWS in esecuzione; alcune descrivono l'ASSENZA di una
# configurazione d'account, che un'analisi dei soli manifest può non vedere.
# =============================================================================
