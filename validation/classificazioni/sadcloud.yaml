# Corrispondenze manuali fra controlli Checkov e voci di sadcloud (validation/PROTOCOLLO.md, §6).
# Il riferimento prescrive che la corrispondenza sia stabilita a mano e riportata con il motivo.
# Decisioni prese il 2026-10-01 dall'agente di sviluppo, su richiesta dell'autore: da rivedere,
# idealmente da un collega. Criterio conservativo: VP solo se un controllo su una risorsa del
# modulo descrive la stessa misconfiguration; un controllo affine ma diverso vale FN.
voci:
  S01:
    esito: VP
    motivo: CKV_AWS_234 verifica la preferenza di registrazione Certificate Transparency del certificato.
    segnalazioni:
    - checkov:CKV_AWS_234:module.acm.aws_acm_certificate.main[0]
  S02:
    esito: FN
    motivo: Nessun controllo segnala l'assegnazione di un ruolo IAM allo stack; quelli sul ruolo ne valutano
      solo la policy.
  S03:
    esito: FN
    motivo: Nessun controllo cerca segreti negli output dello stack (CKV_AWS_124 riguarda le notifiche).
  S04:
