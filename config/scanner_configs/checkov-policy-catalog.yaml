# ============================================================================
# Catalogo semantico delle policy Checkov
# ----------------------------------------------------------------------------
# Classifica ogni controllo fallito in una NATURA e assegna la severità di base:
#
#   EXPOSURE  -> la configurazione apre un varco sfruttabile direttamente
#                (ACL pubblica, policy IAM con privilegi jolly, endpoint senza
#                autenticazione, segreto cablato). Severità HIGH/CRITICAL.
#   HARDENING -> linea di difesa in profondità o requisito di conformità non
#                soddisfatto (logging, versioning, lifecycle, notifiche, ...).
#                Severità LOW (igiene) o MEDIUM (controllo difensivo).
#
# Ordine di risoluzione (prima regola soddisfatta):
#   1. `policies`  : mappatura esplicita per identificativo (CKV_AWS_20, ...)
#   2. `prefixes`  : famiglie di controlli (CKV_SECRET_*)
#   3. `keywords`  : parole chiave confrontate, senza distinzione di maiuscole,
#                    con il NOME UFFICIALE del controllo (non con l'ID, che ha
#                    la forma opaca CKV_AWS_53 e non contiene mai "public").
#   4. `defaults`  : controllo non classificato (natura assente, MEDIUM).
#
# `public: true` indica che la condizione fallita rende la risorsa raggiungibile
# da chiunque: l'adapter allega un RiskContext(internet_exposed, public_resource)
# che attiva il bonus di contesto del risk score (ADR-001, ADR-004).
# `sensitive_data: true` (default false) indica che il controllo riguarda dati
# sensibili (segreti cablati, cifratura a riposo): l'adapter imposta
# RiskContext.sensitive_data_detected. Per i controlli HARDENING il flag è
# solo informativo, perché il contesto non contribuisce al punteggio (ADR-005).
# ============================================================================
version: 1

defaults:
  unclassified_severity: MEDIUM

policies:
  # ─── S3: accesso pubblico ────────────────────────────────────────────────
  CKV_AWS_20:  {nature: EXPOSURE, severity: CRITICAL, public: true}   # ACL public READ
  CKV_AWS_57:  {nature: EXPOSURE, severity: CRITICAL, public: true}   # ACL public WRITE
  CKV_AWS_70:  {nature: EXPOSURE, severity: CRITICAL, public: true}   # bucket policy con Principal "*"
  CKV2_AWS_6:  {nature: EXPOSURE, severity: HIGH}                     # Public Access Block assente
  CKV_AWS_53:  {nature: EXPOSURE, severity: HIGH}                     # block_public_acls = false
  CKV_AWS_54:  {nature: EXPOSURE, severity: HIGH}                     # block_public_policy = false
  CKV_AWS_55:  {nature: EXPOSURE, severity: HIGH}                     # ignore_public_acls = false
  CKV_AWS_56:  {nature: EXPOSURE, severity: HIGH}                     # restrict_public_buckets = false
  CKV2_AWS_65: {nature: HARDENING, severity: MEDIUM}                  # ACL non disabilitate (ownership controls)

  # ─── S3: irrobustimento ──────────────────────────────────────────────────
  CKV_AWS_18:  {nature: HARDENING, severity: LOW}                     # access logging
  CKV_AWS_19:  {nature: HARDENING, severity: MEDIUM, sensitive_data: true} # cifratura server-side
  CKV_AWS_21:  {nature: HARDENING, severity: LOW}                     # versioning
  CKV_AWS_144: {nature: HARDENING, severity: LOW}                     # cross-region replication
  CKV_AWS_145: {nature: HARDENING, severity: MEDIUM, sensitive_data: true} # cifratura con KMS
  CKV2_AWS_61: {nature: HARDENING, severity: LOW}                     # lifecycle configuration
  CKV2_AWS_62: {nature: HARDENING, severity: LOW}                     # event notifications

  # ─── IAM: privilegi eccessivi ────────────────────────────────────────────
  CKV_AWS_1:   {nature: EXPOSURE, severity: CRITICAL}                 # "*-*" admin (policy document)
  CKV_AWS_49:  {nature: EXPOSURE, severity: CRITICAL}                 # "*" actions (policy document)
  CKV_AWS_62:  {nature: EXPOSURE, severity: CRITICAL}                 # "*-*" admin privileges
  CKV_AWS_63:  {nature: EXPOSURE, severity: CRITICAL}                 # "*" actions
  CKV2_AWS_40: {nature: EXPOSURE, severity: CRITICAL}                 # full IAM privileges
  CKV_AWS_107: {nature: EXPOSURE, severity: HIGH}                     # credentials exposure (document)
  CKV_AWS_108: {nature: EXPOSURE, severity: HIGH}                     # data exfiltration (document)
  CKV_AWS_109: {nature: EXPOSURE, severity: HIGH}                     # permissions management (document)
  CKV_AWS_110: {nature: EXPOSURE, severity: CRITICAL}                 # privilege escalation (document)
  CKV_AWS_111: {nature: EXPOSURE, severity: HIGH}                     # write without constraints (document)
  CKV_AWS_286: {nature: EXPOSURE, severity: CRITICAL}                 # privilege escalation
  CKV_AWS_287: {nature: EXPOSURE, severity: HIGH}                     # credentials exposure
  CKV_AWS_288: {nature: EXPOSURE, severity: HIGH}                     # data exfiltration
  CKV_AWS_289: {nature: EXPOSURE, severity: HIGH}                     # permissions management / resource exposure
  CKV_AWS_290: {nature: EXPOSURE, severity: HIGH}                     # write access without constraints
  CKV_AWS_355: {nature: EXPOSURE, severity: HIGH}                     # Resource "*" su azioni restringibili

  # ─── Segreti ─────────────────────────────────────────────────────────────
  CKV_AWS_45:  {nature: EXPOSURE, severity: CRITICAL, sensitive_data: true} # segreti cablati in Lambda env
  CKV_SECRET_2: {nature: EXPOSURE, severity: CRITICAL, sensitive_data: true} # AWS Access Key
  CKV_SECRET_4: {nature: EXPOSURE, severity: HIGH, sensitive_data: true} # Basic Auth credentials
  CKV_SECRET_6: {nature: EXPOSURE, severity: MEDIUM, sensitive_data: true} # stringa ad alta entropia (bassa precisione)
  CKV_SECRET_9: {nature: EXPOSURE, severity: HIGH, sensitive_data: true} # JSON Web Token

  # ─── API Gateway ─────────────────────────────────────────────────────────
  CKV_AWS_59:  {nature: EXPOSURE, severity: HIGH, public: true}       # metodo senza autorizzazione
  CKV2_AWS_29: {nature: HARDENING, severity: MEDIUM}                  # WAF sul gateway pubblico
  CKV2_AWS_51: {nature: HARDENING, severity: MEDIUM}                  # client certificate
  CKV2_AWS_53: {nature: HARDENING, severity: MEDIUM}                  # request validation
  CKV2_AWS_4:  {nature: HARDENING, severity: LOW}                     # logging level dello stage
  CKV_AWS_73:  {nature: HARDENING, severity: LOW}                     # X-Ray tracing
  CKV_AWS_76:  {nature: HARDENING, severity: LOW}                     # access logging
  CKV_AWS_120: {nature: HARDENING, severity: LOW}                     # caching
  CKV_AWS_217: {nature: HARDENING, severity: LOW}                     # create before destroy (deployment)
  CKV_AWS_237: {nature: HARDENING, severity: LOW}                     # create before destroy (rest api)

  # ─── Lambda ──────────────────────────────────────────────────────────────
  CKV_AWS_50:  {nature: HARDENING, severity: LOW}                     # X-Ray tracing
  CKV_AWS_115: {nature: HARDENING, severity: LOW}                     # concurrency limit
  CKV_AWS_116: {nature: HARDENING, severity: LOW}                     # dead letter queue
  CKV_AWS_117: {nature: HARDENING, severity: MEDIUM}                  # dentro una VPC
  CKV_AWS_173: {nature: HARDENING, severity: MEDIUM, sensitive_data: true} # cifratura variabili d'ambiente
  CKV_AWS_272: {nature: HARDENING, severity: MEDIUM}                  # code signing

  # ─── DynamoDB / SNS ──────────────────────────────────────────────────────
  CKV_AWS_28:  {nature: HARDENING, severity: LOW}                     # point-in-time recovery
  CKV_AWS_119: {nature: HARDENING, severity: MEDIUM, sensitive_data: true} # cifratura con CMK
  CKV_AWS_26:  {nature: HARDENING, severity: MEDIUM}                  # cifratura topic SNS
  CKV_AWS_169: {nature: EXPOSURE, severity: HIGH, public: true}       # policy SNS pubblica

  # ─── Rete / EC2 / RDS (controlli comuni fuori dal bersaglio di prova) ───
  CKV_AWS_23:  {nature: HARDENING, severity: LOW}                     # descrizione security group
  CKV_AWS_24:  {nature: EXPOSURE, severity: CRITICAL, public: true}   # SSH da 0.0.0.0/0
  CKV_AWS_25:  {nature: EXPOSURE, severity: CRITICAL, public: true}   # RDP da 0.0.0.0/0
  CKV_AWS_260: {nature: EXPOSURE, severity: HIGH, public: true}       # HTTP da 0.0.0.0/0
  CKV_AWS_277: {nature: EXPOSURE, severity: CRITICAL, public: true}   # ingress -1 da 0.0.0.0/0
  CKV2_AWS_5:  {nature: HARDENING, severity: LOW}                     # security group non associato
  CKV_AWS_8:   {nature: HARDENING, severity: MEDIUM, sensitive_data: true} # EBS cifrato (launch config)
  CKV_AWS_79:  {nature: HARDENING, severity: MEDIUM}                  # IMDSv2
  CKV_AWS_88:  {nature: EXPOSURE, severity: HIGH, public: true}       # IP pubblico su EC2
  CKV_AWS_126: {nature: HARDENING, severity: LOW}                     # detailed monitoring
  CKV_AWS_135: {nature: HARDENING, severity: LOW}                     # EBS optimized
  CKV_AWS_16:  {nature: HARDENING, severity: MEDIUM, sensitive_data: true} # RDS cifrato
  CKV_AWS_17:  {nature: EXPOSURE, severity: CRITICAL, public: true}   # RDS publicly accessible

  # ─── Kubernetes (crAPI) ──────────────────────────────────────────────────
  CKV_K8S_8:   {nature: HARDENING, severity: LOW}                     # liveness probe
  CKV_K8S_9:   {nature: HARDENING, severity: LOW}                     # readiness probe
  CKV_K8S_10:  {nature: HARDENING, severity: LOW}                     # CPU requests
  CKV_K8S_11:  {nature: HARDENING, severity: LOW}                     # CPU limits
  CKV_K8S_12:  {nature: HARDENING, severity: LOW}                     # memory requests
  CKV_K8S_13:  {nature: HARDENING, severity: LOW}                     # memory limits
  CKV_K8S_14:  {nature: HARDENING, severity: LOW}                     # image tag non fissato
  CKV_K8S_15:  {nature: HARDENING, severity: LOW}                     # image pull policy
  CKV_K8S_20:  {nature: HARDENING, severity: MEDIUM}                  # allowPrivilegeEscalation
  CKV_K8S_21:  {nature: HARDENING, severity: LOW}                     # namespace default
  CKV_K8S_22:  {nature: HARDENING, severity: MEDIUM}                  # filesystem in sola lettura
  CKV_K8S_23:  {nature: HARDENING, severity: MEDIUM}                  # contenitori root
  CKV_K8S_28:  {nature: HARDENING, severity: MEDIUM}                  # capability NET_RAW
  CKV_K8S_29:  {nature: HARDENING, severity: MEDIUM}                  # security context (pod)
  CKV_K8S_30:  {nature: HARDENING, severity: MEDIUM}                  # security context (container)
  CKV_K8S_31:  {nature: HARDENING, severity: MEDIUM}                  # seccomp profile
  CKV_K8S_35:  {nature: HARDENING, severity: LOW}                     # secrets come file vs env
  CKV_K8S_37:  {nature: HARDENING, severity: MEDIUM}                  # capabilities assegnate
  CKV_K8S_38:  {nature: HARDENING, severity: MEDIUM}                  # service account token
  CKV_K8S_40:  {nature: HARDENING, severity: LOW}                     # UID alto
  CKV_K8S_42:  {nature: HARDENING, severity: MEDIUM}                  # default service account
  CKV_K8S_43:  {nature: HARDENING, severity: LOW}                     # image digest
  CKV2_K8S_6:  {nature: HARDENING, severity: MEDIUM}                  # NetworkPolicy assente

  # ─── Dockerfile ──────────────────────────────────────────────────────────
  CKV_DOCKER_2: {nature: HARDENING, severity: LOW}                    # HEALTHCHECK
  CKV_DOCKER_3: {nature: HARDENING, severity: MEDIUM}                 # utente non privilegiato
  CKV_DOCKER_9: {nature: HARDENING, severity: LOW}                    # uso di APT

  # ─── OpenAPI (lint Checkov) ──────────────────────────────────────────────
  CKV_OPENAPI_4:  {nature: EXPOSURE, severity: HIGH}                  # security globale assente
  CKV_OPENAPI_5:  {nature: EXPOSURE, severity: HIGH}                  # security vuota sulle operazioni
  CKV_OPENAPI_21: {nature: HARDENING, severity: LOW}                  # maxItems sugli array

prefixes:
  CKV_SECRET_: {nature: EXPOSURE, severity: HIGH, sensitive_data: true} # riconoscitore di segreti

# Parole chiave di ripiego per i controlli non presenti in `policies`.
# I gruppi sono valutati nell'ordine in cui compaiono: i termini difensivi
# (encrypt, kms, waf, ...) precedono quelli di esposizione così che
# "Secrets Manager secret is encrypted" non venga letto come segreto esposto.
keywords:
  - nature: HARDENING
    severity: MEDIUM
    terms:
      - encrypt
      - kms
      - cmk
      - customer managed
      - waf
      - client certificate
      - code-signing
      - code signing
      - security context
      - seccomp
      - read-only
      - readonly
      - networkpolicy
      - network policy
      - capabilit
      - imdsv2
      - tls
      - https
      - mfa
      - password policy
      - rotation
      - deletion protection
      - object lock
      - inside a vpc
      - in a vpc
      - validat
      - root
  - nature: HARDENING
    severity: LOW
    terms:
      - logging
      - logs
      - versioning
      - lifecycle
      - notification
      - replication
      - backup
      - point in time
      - tracing
      - x-ray
      - caching
      - create before destroy
      - dead letter
      - concurrent execution
      - healthcheck
      - health check
      - liveness
      - readiness
      - image tag
      - tags
      - digest
      - namespace
      - requests should be set
      - limits should be set
      - image pull policy
      - description
      - monitoring
      - alarm
      - retention
      - latest
  - nature: EXPOSURE
    severity: HIGH
    public: true
    terms:
      - public
      - "0.0.0.0"
      - "::/0"
      - any principal
      - open access
      - anonymous
      - unauthenticated
      - open to the world
  - nature: EXPOSURE
    severity: HIGH
    terms:
      - privilege escalation
      - administrative privileges
      - full iam
      - '"*"'
      - wildcard
      - hard-coded
      - hardcoded
      - secret
      - credentials exposure
      - data exfiltration
      - without constraints
      - permissions management
      - no authentication
      - security operations
      - security field
